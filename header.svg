<svg width="800" height="160" viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="memGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="40%"  stop-color="#ff758c"/>
      <stop offset="70%"  stop-color="#ce93d8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="verGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#81d4fa"/>
      <stop offset="50%"  stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#ffcc80"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Arka plan -->
  <rect width="800" height="160" fill="#0f172a" rx="16"/>

  <!-- Yıldız noktalar -->
  <circle cx="40"  cy="20"  r="1.2" fill="white" opacity="0.6"/>
  <circle cx="120" cy="45"  r="0.8" fill="white" opacity="0.4"/>
  <circle cx="200" cy="15"  r="1.5" fill="white" opacity="0.7"/>
  <circle cx="320" cy="30"  r="0.8" fill="white" opacity="0.5"/>
  <circle cx="450" cy="12"  r="1.2" fill="white" opacity="0.6"/>
  <circle cx="560" cy="40"  r="0.9" fill="white" opacity="0.4"/>
  <circle cx="650" cy="18"  r="1.4" fill="white" opacity="0.7"/>
  <circle cx="750" cy="35"  r="0.8" fill="white" opacity="0.5"/>
  <circle cx="70"  cy="130" r="1.0" fill="white" opacity="0.4"/>
  <circle cx="180" cy="145" r="0.8" fill="white" opacity="0.5"/>
  <circle cx="400" cy="148" r="1.2" fill="white" opacity="0.3"/>
  <circle cx="620" cy="135" r="0.9" fill="white" opacity="0.4"/>
  <circle cx="730" cy="142" r="1.1" fill="white" opacity="0.6"/>

  <!-- MEMORY yazısı -->
  <text
    x="400" y="88"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="72"
    font-weight="700"
    letter-spacing="12"
    fill="url(#memGrad)"
    filter="url(#glow)"
  >MEMORY</text>

  <!-- VERSE yazısı -->
  <text
    x="400" y="130"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="28"
    font-weight="400"
    letter-spacing="18"
    fill="url(#verGrad)"
    filter="url(#glow)"
  >VERSE</text>

  <!-- Dekoratif çizgiler -->
  <line x1="80" y1="108" x2="310" y2="108" stroke="url(#verGrad)" stroke-width="0.6" opacity="0.4"/>
  <line x1="490" y1="108" x2="720" y2="108" stroke="url(#verGrad)" stroke-width="0.6" opacity="0.4"/>

  <!-- Küçük ✦ ikonları -->
  <text x="340" y="113" text-anchor="middle" font-size="10" fill="#ff758c" opacity="0.8">✦</text>
  <text x="460" y="113" text-anchor="middle" font-size="10" fill="#ff758c" opacity="0.8">✦</text>
</svg>
